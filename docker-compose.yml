services:
  api:
    build:
      context: ./sar-api
      dockerfile: Dockerfile
    container_name: sar-api-local
    env_file:
      - path: ./sar-api/.env.sample
      - path: ./sar-api/.env.local
        required: false
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      # GEO_SERVER_URL: http://geoserver:8080/geoserver
      BACKEND_URL: http://localhost:18000/api/v1
      FRONT_END_URL: http://localhost:18080
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 80 --reload"
    ports:
      - "18000:80"
    volumes:
      - ./sar-api:/app
      - ./sar-worker-2/output:/app/local-ndvi-output
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./sar-fe
      dockerfile: Dockerfile
      args:
        BUILD_MODE: docker
    container_name: sar-fe-local
    ports:
      - "18080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

