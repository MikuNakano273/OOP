  postgres:
    image: postgis/postgis:17-3.5
    container_name: sar-postgres-local
    environment:
      POSTGRES_DB: sar
      POSTGRES_USER: sar
      POSTGRES_PASSWORD: sar123
      TZ: UTC
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sar-api/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sar -d sar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sar-redis-local
    command: redis-server --appendonly yes
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: sar-mailpit-local
    ports:
      - "51025:1025"
      - "58025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
